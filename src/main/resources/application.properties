spring.application.name=jwt-auth-template

# ================================================================== #

# MySQL Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/your_database
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# ================================================================== #

# Spring Data JPA & Hibernate Configuration

spring.jpa.database-platform = org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

# ================================================================== #

# Authentication Properties

# "pc_part_picker_super_secret_key_java_spring_boot_backend_service" encoded in base64
security.jwt.secret-key=cGNfcGFydF9waWNrZXJfc3VwZXJfc2VjcmV0X2tleV9qYXZhX3NwcmluZ19ib290X2JhY2tlbmRfc2VydmljZQ==

# 1d in millisecond
security.jwt.expiration-time=86400000

# ================================================================== #

# CORS Configuration

# comma-separated list of allowed origins
app.cors.allowed-origins=http://localhost:5173


# ================================================================== #
